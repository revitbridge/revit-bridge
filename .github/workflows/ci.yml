name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Forbidden dependencies must be absent
        shell: bash
        run: |
          if uv tree | grep -iE "openai|anthropic|google-genai|cohere|chromadb|fastapi"; then
            echo "forbidden dependency found" && exit 1
          fi
      - name: CLI smoke
        run: uv run revit-bridge --version
