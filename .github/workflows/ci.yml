name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Sync
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Build
        run: uv build
      - name: Built wheel installs and carries its data
        shell: bash
        run: |
          uv venv build/wheel-check
          if [ -d build/wheel-check/Scripts ]; then bin=build/wheel-check/Scripts; else bin=build/wheel-check/bin; fi
          uv pip install --python build/wheel-check dist/*.whl
          "$bin/revit-bridge" --version
          "$bin/python" -I -c '
          import pathlib, subprocess, tomllib
          import revit_bridge
          from revit_bridge import paths
          pkg = pathlib.Path(revit_bridge.__file__).resolve().parent
          assert "site-packages" in pkg.parts, f"imported from the source tree: {pkg}"
          assert paths.builtin_capabilities_dir() == pkg / "capabilities" / "builtin", paths.builtin_capabilities_dir()
          assert paths.skills_dir() == pkg / "skills", paths.skills_dir()
          assert paths.guidance_dir() == pkg / "guidance_content", paths.guidance_dir()
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          missing = []
          for source, target in project["tool"]["hatch"]["build"]["targets"]["wheel"]["force-include"].items():
              out = subprocess.run(["git", "ls-files", "-z", source], capture_output=True, check=True).stdout
              tracked = [f for f in out.decode("utf-8").split("\0") if f]
              assert tracked, f"no tracked files under {source}"
              root = pkg.parent / target
              missing += [f for f in tracked if not (root / pathlib.PurePosixPath(f).relative_to(source)).is_file()]
              print(f"{source} -> {target}: {len(tracked)} tracked files checked")
          assert not missing, f"missing from the installed wheel: {missing}"
          '
      - name: Forbidden dependencies must be absent
        shell: bash
        # The names of FORBIDDEN in tests/test_package.py, in the same order; the test
        # test_the_ci_check_and_this_test_forbid_the_same_packages keeps the two identical.
        run: |
          if uv tree | grep -iE "openai|anthropic|google-genai|google.generativeai|cohere|chromadb|fastapi|langchain"; then
            echo "forbidden dependency found" && exit 1
          fi
      - name: CLI smoke
        run: uv run revit-bridge --version
