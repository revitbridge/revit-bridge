name: Publish to PyPI

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release tests run on an interpreter the CI matrix covers, never the runner's
      # default (0.6.1 failed on the runner's 3.14 while CI tested only 3.11 and 3.13).
      # 3.14 is the newest in the matrix and what a fresh `uvx revit-bridge` most likely gets.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Tag must match the package version
        run: |
          expected="v$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${expected}" && exit 1
          fi
      - run: uv sync
      - run: uv run pytest
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing (no API token stored)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
