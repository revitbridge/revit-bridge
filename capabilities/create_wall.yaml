schema_version: 1
name: create_wall
display_name: Create Wall
description: Create a straight wall between two points on a level, with the given height.
  The wall uses the document's default wall type.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      return new { Status = "Error", Message = "Level '{level_name}' not found" };

  // Step 2: Create wall line from mm coordinates
  XYZ start = new XYZ({start_x} / 304.8, {start_y} / 304.8, 0);
  XYZ end = new XYZ({end_x} / 304.8, {end_y} / 304.8, 0);
  Line wallLine = Line.CreateBound(start, end);

  // Step 3: Create wall (Transaction already active - do NOT create one)
  Wall wall = Wall.Create(document, wallLine, level.Id, false);
  wall.get_Parameter(BuiltInParameter.WALL_USER_HEIGHT_PARAM)
      .Set({height} / 304.8);

  return new { ElementId = wall.Id.Value, Status = "Created", Level = level.Name };
parameters:
  - name: level_name
    type: string
    description: Level the wall stands on
    source: tool:levels
    choices_from: levels
    required: true
  - name: start_x
    type: double
    description: Wall start X (mm)
    unit: mm
    source: designer
    required: true
  - name: start_y
    type: double
    description: Wall start Y (mm)
    unit: mm
    source: designer
    required: true
  - name: end_x
    type: double
    description: Wall end X (mm)
    unit: mm
    source: designer
    required: true
  - name: end_y
    type: double
    description: Wall end Y (mm)
    unit: mm
    source: designer
    required: true
  - name: height
    type: double
    description: Wall height (mm)
    unit: mm
    source: default
    required: false
    default: 3000
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Walls
not_for:
  - "curtain wall"
  - "modify wall"
  - "wall type"
applies_when:
  - "create wall"
  - "draw wall"
  - "place wall"
validator:
  kind: count_delta
  category: OST_Walls
  expected: 1
fixtures:
  - name: basic
    params: {level_name: "L1", start_x: 0, start_y: 0, end_x: 5000, end_y: 0, height: 3000}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a wall
