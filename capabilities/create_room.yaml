schema_version: 1
name: create_room
display_name: Create Office Room (5 m x 4 m)
description: 'Build a 5 m x 4 m office on level ''L1'': four ''Generic - 150mm'' walls 3 m high from the
  origin, a room named ''办公室'' numbered 101, and its tag. Everything is fixed in the code; solidified
  from a chat run.'
version: 1.0.0
revit_versions:
- '2026'
code_template: |-
  // Step 1: Get the wall type "Generic - 150mm" — using FilteredElementCollector with OfClass(WallType)
  WallType wallType = new FilteredElementCollector(document)
      .OfClass(typeof(WallType))
      .Cast<WallType>()
      .FirstOrDefault(wt => wt.Name == "Generic - 150mm");

  if (wallType == null)
      return new { Status = "Error", Message = "WallType 'Generic - 150mm' not found." };

  // Step 2: Get the level "L1" — using FilteredElementCollector with OfClass(Level)
  Level level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "L1");

  if (level == null)
      return new { Status = "Error", Message = "Level 'L1' not found." };

  // Step 3: Define the room dimensions — 5m x 4m in feet (1m = 1/0.3048 ft)
  double width  = 5.0 / 0.3048; // 5m in feet
  double depth  = 4.0 / 0.3048; // 4m in feet
  double height = 3.0 / 0.3048; // 3m wall height in feet

  // Step 4: Define the four corner points of the room
  XYZ pt0 = new XYZ(0,     0,     level.Elevation);
  XYZ pt1 = new XYZ(width, 0,     level.Elevation);
  XYZ pt2 = new XYZ(width, depth, level.Elevation);
  XYZ pt3 = new XYZ(0,     depth, level.Elevation);

  // Step 5: Define the four wall curves (closed loop)
  List<Curve> wallCurves = new List<Curve>
  {
      Line.CreateBound(pt0, pt1), // South wall
      Line.CreateBound(pt1, pt2), // East wall
      Line.CreateBound(pt2, pt3), // North wall
      Line.CreateBound(pt3, pt0)  // West wall
  };

  // Step 6: Create the four walls using Wall.Create — structural = false
  List<Wall> createdWalls = new List<Wall>();
  foreach (Curve curve in wallCurves)
  {
      Wall wall = Wall.Create(
          document,
          curve,
          wallType.Id,
          level.Id,
          height,
          0.0,    // offset from level
          false,  // flip
          false   // structural
      );
      createdWalls.Add(wall);
  }

  // Step 7: Create a Room at the center of the office — using document.Create.NewRoom
  // Room center point (UV for plan placement)
  double centerX = width  / 2.0;
  double centerY = depth  / 2.0;
  UV roomCenter = new UV(centerX, centerY);

  Autodesk.Revit.DB.Architecture.Room room =
      document.Create.NewRoom(level, roomCenter);

  if (room == null)
      return new { Status = "Error", Message = "Failed to create room." };

  // Step 8: Set the room name and number
  room.Name   = "办公室";
  room.Number = "101";

  // Step 9: Get the active view to place the room tag
  // Use the first floor plan view associated with L1
  View tagView = new FilteredElementCollector(document)
      .OfClass(typeof(ViewPlan))
      .Cast<ViewPlan>()
      .FirstOrDefault(v => v.GenLevel != null && v.GenLevel.Id == level.Id && !v.IsTemplate);

  if (tagView == null)
  {
      // Fallback: any floor plan view
      tagView = new FilteredElementCollector(document)
          .OfClass(typeof(ViewPlan))
          .Cast<ViewPlan>()
          .FirstOrDefault(v => !v.IsTemplate);
  }

  Autodesk.Revit.DB.Architecture.RoomTag roomTag = null;
  if (tagView != null)
  {
      // Step 10: Create a RoomTag at the room center — using document.Create.NewRoomTag
      roomTag = document.Create.NewRoomTag(
          new LinkElementId(room.Id),
          roomCenter,
          tagView.Id
      );
  }

  // Step 11: Return summary of created elements
  return new
  {
      Status       = "Success",
      Message      = "办公室创建成功 (5m x 4m)",
      WallCount    = createdWalls.Count,
      WallIds      = createdWalls.Select(w => w.Id.Value).ToList(),
      RoomId       = room.Id.Value,
      RoomName     = room.Name,
      RoomNumber   = room.Number,
      RoomTagId    = roomTag != null ? roomTag.Id.Value : -1L,
      LevelName    = level.Name,
      WallTypeName = wallType.Name
  };
parameters: []
preconditions:
- kind: levels_min
  value: 1
- kind: category_present
  category: OST_Walls
- text: level 'L1' and wall type 'Generic - 150mm' must exist; a floor plan view of L1 is needed for the
    tag
not_for:
- a room of another size
- rooms in existing walls
applies_when:
- 5 m x 4 m office with walls, room and tag on L1
validator:
  kind: count_delta
  category: OST_Walls
  expected: 4
fixtures: []
