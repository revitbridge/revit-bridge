schema_version: 1
name: create_floor
display_name: Create Floor
description: Create a rectangular floor slab of a named floor type on a level, from an
  origin corner and a width/length.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get floor type by name
  var floorType = new FilteredElementCollector(document)
      .OfClass(typeof(FloorType))
      .Cast<FloorType>()
      .FirstOrDefault(ft => ft.Name == "{type_name}");
  if (floorType == null)
      return new { Status = "Error", Message = "Floor type '{type_name}' not found" };

  // Step 2: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      return new { Status = "Error", Message = "Level '{level_name}' not found" };

  // Step 3: Create rectangular profile (mm -> feet)
  double x0 = {x} / 304.8, y0 = {y} / 304.8;
  double w = {width} / 304.8, h = {length} / 304.8;
  var profile = new List<Curve>();
  profile.Add(Line.CreateBound(new XYZ(x0, y0, 0), new XYZ(x0 + w, y0, 0)));
  profile.Add(Line.CreateBound(new XYZ(x0 + w, y0, 0), new XYZ(x0 + w, y0 + h, 0)));
  profile.Add(Line.CreateBound(new XYZ(x0 + w, y0 + h, 0), new XYZ(x0, y0 + h, 0)));
  profile.Add(Line.CreateBound(new XYZ(x0, y0 + h, 0), new XYZ(x0, y0, 0)));
  var curveLoop = CurveLoop.Create(profile);

  // Step 4: Create floor
  var floor = Floor.Create(document, new List<CurveLoop> { curveLoop },
                           floorType.Id, level.Id);

  return new { ElementId = floor.Id.Value, Status = "Created",
               FloorType = floorType.Name, Level = level.Name };
parameters:
  - name: type_name
    type: string
    description: Floor type name
    source: tool:floor_types
    choices_from: floor_types
    required: true
  - name: level_name
    type: string
    description: Level the floor sits on
    source: tool:levels
    choices_from: levels
    required: true
  - name: x
    type: double
    description: Floor origin corner X (mm)
    unit: mm
    source: designer
    required: true
  - name: y
    type: double
    description: Floor origin corner Y (mm)
    unit: mm
    source: designer
    required: true
  - name: width
    type: double
    description: Floor width along X (mm)
    unit: mm
    source: designer
    required: true
  - name: length
    type: double
    description: Floor length along Y (mm)
    unit: mm
    source: designer
    required: true
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Floors
not_for:
  - "roof"
  - "ceiling"
  - "sloped floor"
applies_when:
  - "create floor"
  - "floor slab"
  - "rectangular slab"
validator:
  kind: created_ids
  category: OST_Floors
fixtures:
  - name: basic
    params: {type_name: "Generic 150mm", level_name: "L1", x: 0, y: 0, width: 6000, length: 8000}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a floor slab
