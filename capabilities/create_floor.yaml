schema_version: 1
name: create_floor
display_name: Create Floor
description: >-
  Create one floor of a named type on a level. Use x, y, width and length for a rectangle or
  points for a closed polygon. Dimensions and elevations are in mm.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get floor type by name
  string typeName = "{type_name}";
  var matches = new FilteredElementCollector(document)
      .OfClass(typeof(FloorType))
      .Cast<FloorType>()
      .Where(ft => ft.Name == typeName || ft.FamilyName + ": " + ft.Name == typeName).Take(2).ToList();
  if (matches.Count != 1)
      throw new InvalidOperationException("REFUSED: The requested floor type is missing or ambiguous. Give Family: Type.");
  FloorType floorType = matches[0];

  // Step 2: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      throw new InvalidOperationException("REFUSED: The requested level is missing.");

  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<string, string, double> toFeet = (label, text) =>
  {
      double mm;
      if (!double.TryParse(text, System.Globalization.NumberStyles.Float, invariant, out mm)
          || double.IsInfinity(mm) || double.IsNaN(mm))
          throw new InvalidOperationException("REFUSED: Give a finite " + label + " in mm.");
      return UnitUtils.ConvertToInternalUnits(mm, UnitTypeId.Millimeters);
  };
  double tolerance = document.Application.ShortCurveTolerance;
  double z = 0;
  string pointsText = "{points}";
  var corners = new List<XYZ>();
  double width, length;
  if (pointsText.Length > 0)
  {
      if (new string[] { "{x}", "{y}", "{width}", "{length}" }.Any(v => v.Length > 0))
          throw new InvalidOperationException("REFUSED: Supply a polygon or a rectangle, not both.");
      string[] pairs = pointsText.Split(';');
      if (pairs.Length < 3 || pairs.Length > 256)
          throw new InvalidOperationException("REFUSED: Give 3 to 256 polygon vertices as x,y; x,y; x,y.");
      foreach (string pair in pairs)
      {
          string[] xy = pair.Split(',');
          if (xy.Length != 2)
              throw new InvalidOperationException("REFUSED: Each polygon vertex must have an x and a y in mm.");
          corners.Add(new XYZ(toFeet("Vertex X", xy[0]), toFeet("Vertex Y", xy[1]), z));
      }
      width = corners.Max(p => p.X) - corners.Min(p => p.X);
      length = corners.Max(p => p.Y) - corners.Min(p => p.Y);
  }
  else
  {
      double x = toFeet("X", "{x}"), y = toFeet("Y", "{y}");
      width = toFeet("Width", "{width}");
      length = toFeet("Length", "{length}");
      corners.AddRange(new[] { new XYZ(x, y, z), new XYZ(x + width, y, z),
          new XYZ(x + width, y + length, z), new XYZ(x, y + length, z) });
  }
  if (!corners.All(p => XYZ.IsWithinLengthLimits(p)))
      throw new InvalidOperationException("REFUSED: The outline reaches outside the model's limits.");
  var edges = new List<Curve>();
  for (int i = 0; i < corners.Count; i++)
  {
      XYZ start = corners[i], end = corners[(i + 1) % corners.Count];
      if (start.DistanceTo(end) <= tolerance)
          throw new InvalidOperationException("REFUSED: Two consecutive vertices are too close together.");
      edges.Add(Line.CreateBound(start, end));
  }

  // Step 4: Create floor
  var curveLoop = CurveLoop.Create(edges);
  var floor = Floor.Create(document, new List<CurveLoop> { curveLoop },
                           floorType.Id, level.Id);

  if (bool.Parse("{structural}"))
  {
      Parameter structural = floor.get_Parameter(BuiltInParameter.FLOOR_PARAM_IS_STRUCTURAL);
      if (structural == null || structural.IsReadOnly || !structural.Set(1))
          throw new InvalidOperationException("REFUSED: The floor cannot be marked structural.");
  }
  if ("{offset}".Length > 0)
  {
      Parameter offset = floor.get_Parameter(BuiltInParameter.FLOOR_HEIGHTABOVELEVEL_PARAM);
      if (offset == null || offset.IsReadOnly || !offset.Set(toFeet("Offset", "{offset}")))
          throw new InvalidOperationException("REFUSED: The floor offset cannot be set.");
  }

  return new { ElementId = floor.Id.Value, Status = "Created",
               FloorType = floorType.Name, Level = level.Name };
parameters:
  - name: type_name
    type: string
    description: Floor type name
    source: tool:floor_types
    choices_from: floor_types
    required: true
  - name: level_name
    type: string
    description: Level the floor sits on
    source: tool:levels
    choices_from: levels
    required: true
  - name: x
    type: double
    description: Floor origin corner X (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: y
    type: double
    description: Floor origin corner Y (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: width
    type: double
    description: Floor width along X (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: length
    type: double
    description: Floor length along Y (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: points
    type: string
    description: "Polygon outline in mm, as x,y; x,y; x,y, with an implicit closing edge."
    source: designer
    required: false
    default: ""
  - name: offset
    type: double
    description: "Vertical offset from the level (mm)."
    unit: mm
    source: designer
    required: false
    default: ""
  - name: structural
    type: bool
    description: "Mark the floor as structural."
    source: designer
    required: false
    default: false
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Floors
not_for:
  - "roof"
  - "ceiling"
  - "sloped floor"
applies_when:
  - "create floor"
  - "floor slab"
  - "rectangular slab"
validator:
  kind: created_ids
  category: OST_Floors
fixtures:
  - name: basic
    params: {type_name: "Generic 150mm", level_name: "L1", x: 0, y: 0, width: 6000, length: 8000}
    expect: {Status: "Created"}
  - name: polygon
    params: {"level_name":"L1","type_name":"Generic","points":"0,0; 5000,0; 4000,4000; 0,4000","offset":100,"structural":true}
    expect: {"Status":"Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a floor slab
