schema_version: 1
name: create_beam
display_name: Create Beam
description: Create a structural beam of a named family type between two points at an
  elevation, on a level.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get beam family symbol by name
  var symbol = new FilteredElementCollector(document)
      .OfClass(typeof(FamilySymbol))
      .OfCategory(BuiltInCategory.OST_StructuralFraming)
      .Cast<FamilySymbol>()
      .FirstOrDefault(s => s.Name == "{type_name}");
  if (symbol == null)
      return new { Status = "Error", Message = "Beam type '{type_name}' not found" };
  if (!symbol.IsActive) symbol.Activate();

  // Step 2: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      return new { Status = "Error", Message = "Level '{level_name}' not found" };

  // Step 3: Create beam line (mm -> feet)
  XYZ start = new XYZ({start_x} / 304.8, {start_y} / 304.8, {elevation} / 304.8);
  XYZ end = new XYZ({end_x} / 304.8, {end_y} / 304.8, {elevation} / 304.8);
  Line beamLine = Line.CreateBound(start, end);

  // Step 4: Create beam instance
  var beam = document.Create.NewFamilyInstance(
      beamLine, symbol, level,
      Autodesk.Revit.DB.Structure.StructuralType.Beam);

  return new { ElementId = beam.Id.Value, Status = "Created",
               FamilyType = symbol.Name, Level = level.Name };
parameters:
  - name: type_name
    type: string
    description: Beam family type name
    source: tool:family_types
    choices_from: family_types:OST_StructuralFraming
    required: true
  - name: level_name
    type: string
    description: Reference level name
    source: tool:levels
    choices_from: levels
    required: true
  - name: start_x
    type: double
    description: Beam start X (mm)
    unit: mm
    source: designer
    required: true
  - name: start_y
    type: double
    description: Beam start Y (mm)
    unit: mm
    source: designer
    required: true
  - name: end_x
    type: double
    description: Beam end X (mm)
    unit: mm
    source: designer
    required: true
  - name: end_y
    type: double
    description: Beam end Y (mm)
    unit: mm
    source: designer
    required: true
  - name: elevation
    type: double
    description: Beam elevation, absolute Z (mm)
    unit: mm
    source: designer
    required: true
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_StructuralFraming
  - text: "structural framing families must be loaded"
not_for:
  - "beam system"
  - "brace"
applies_when:
  - "create beam"
  - "structural beam between two points"
validator:
  kind: created_ids
  category: OST_StructuralFraming
fixtures:
  - name: basic
    params: {type_name: "W310X38.7", level_name: "L1", start_x: 0, start_y: 0, end_x: 5000, end_y: 0, elevation: 3000}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a structural beam
