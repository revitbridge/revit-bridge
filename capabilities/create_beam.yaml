schema_version: 1
name: create_beam
display_name: Create Beam
description: Create a structural beam of a named family type between two points at an
  elevation, on a level.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get beam family symbol by name
  var types = new FilteredElementCollector(document)
      .OfClass(typeof(FamilySymbol))
      .OfCategory(BuiltInCategory.OST_StructuralFraming)
      .Cast<FamilySymbol>()
      .Where(s => s.Name == "{type_name}" || s.FamilyName + ": " + s.Name == "{type_name}").Take(2).ToList();
  if (types.Count > 1)
      throw new InvalidOperationException("REFUSED: More than one beam type matches; give Family: Type.");
  var symbol = types.SingleOrDefault();
  if (symbol == null)
      throw new InvalidOperationException("REFUSED: The requested beam type is missing.");
  if (!symbol.IsActive) symbol.Activate();

  // Step 2: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      throw new InvalidOperationException("REFUSED: The requested level is missing.");

  // Step 3: Create beam line (mm -> feet)
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<string, double> mm = text => double.Parse(text, System.Globalization.NumberStyles.Float, invariant) / 304.8;
  XYZ start = new XYZ(mm("{start_x}"), mm("{start_y}"), mm("{elevation}") + mm("{start_offset}"));
  XYZ end = new XYZ(mm("{end_x}"), mm("{end_y}"), mm("{elevation}") + mm("{end_offset}"));
  Line beamLine = Line.CreateBound(start, end);

  // Step 4: Create beam instance
  var beam = document.Create.NewFamilyInstance(
      beamLine, symbol, level,
      Autodesk.Revit.DB.Structure.StructuralType.Beam);

  string usageText = "{structural_usage}";
  if (usageText.Length > 0)
  {
      Autodesk.Revit.DB.Structure.StructuralInstanceUsage usage;
      if (!Enum.TryParse(usageText, true, out usage) || !Enum.IsDefined(typeof(Autodesk.Revit.DB.Structure.StructuralInstanceUsage), usage))
          throw new InvalidOperationException("REFUSED: Unknown structural usage " + usageText + ".");
      beam.StructuralUsage = usage;
      if (beam.StructuralUsage != usage)
          throw new InvalidOperationException("REFUSED: The beam family did not accept this structural usage.");
  }
  return new { ElementId = beam.Id.Value, Status = "Created",
               FamilyType = symbol.Name, Level = level.Name };
parameters:
  - name: type_name
    type: string
    description: Beam family type name
    source: tool:family_types
    choices_from: family_types:OST_StructuralFraming
    required: true
  - name: level_name
    type: string
    description: Reference level name
    source: tool:levels
    choices_from: levels
    required: true
  - name: start_x
    type: double
    description: Beam start X (mm)
    unit: mm
    source: designer
    required: true
  - name: start_y
    type: double
    description: Beam start Y (mm)
    unit: mm
    source: designer
    required: true
  - name: end_x
    type: double
    description: Beam end X (mm)
    unit: mm
    source: designer
    required: true
  - name: end_y
    type: double
    description: Beam end Y (mm)
    unit: mm
    source: designer
    required: true
  - name: elevation
    type: double
    description: Beam elevation, absolute Z (mm)
    unit: mm
    source: designer
    required: true
  - name: start_offset
    type: double
    description: "Vertical offset of the start from elevation (mm)."
    unit: mm
    source: designer
    required: false
    default: 0
  - name: end_offset
    type: double
    description: "Vertical offset of the end from elevation (mm)."
    unit: mm
    source: designer
    required: false
    default: 0
  - name: structural_usage
    type: string
    description: "Structural usage, for example Girder, Joist, or Purlin."
    source: designer
    required: false
    default: ""
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_StructuralFraming
  - text: "structural framing families must be loaded"
not_for:
  - "beam system"
  - "brace"
applies_when:
  - "create beam"
  - "structural beam between two points"
validator:
  kind: created_ids
  category: OST_StructuralFraming
fixtures:
  - name: basic
    params: {type_name: "W310X38.7", level_name: "L1", start_x: 0, start_y: 0, end_x: 5000, end_y: 0, elevation: 3000}
    expect: {Status: "Created"}
  - name: sloping
    params: {"type_name":"W310X38.7","level_name":"L1","start_x":0,"start_y":0,"end_x":5000,"end_y":0,"elevation":3000,"start_offset":100,"end_offset":200,"structural_usage":"Girder"}
    expect: {"Status":"Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a structural beam
