schema_version: 1
name: list_types
display_name: List Types
description: >-
  Read only. List the types of one category (an OST_* name), loadable and system types alike:
  family name, type name and id, sorted by family and type, at most limit rows (default 100,
  at most 200) with Truncated saying whether types were left out. The ids are what
  change_type takes.
version: "1.0.0"
revit_versions: ["2021", "2022", "2023", "2024", "2025", "2026", "2027"]
code_template: |
  // Read only. Every refusal throws, so the add-in reports the message and keeps nothing.
  // The bridge already opened the transaction; none is opened here.
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<ElementId, long> idOf = id => long.Parse(id.ToString(), invariant);
  string categoryName = "{category}";
  string limitText = "{limit}";
  const int MaxRows = 200;

  BuiltInCategory category;
  if (!categoryName.StartsWith("OST_", StringComparison.Ordinal) || !Enum.TryParse(categoryName, out category)
      || !Enum.IsDefined(typeof(BuiltInCategory), category))
      throw new InvalidOperationException("\"" + categoryName + "\" is not a category name; use an OST_ name such as OST_Walls.");
  if (Category.GetCategory(document, category) == null)
      throw new InvalidOperationException(categoryName + " is not a category of this model.");
  int limit;
  if (!int.TryParse(limitText, System.Globalization.NumberStyles.Integer, invariant, out limit) || limit < 1)
      throw new InvalidOperationException("The limit must be a whole number from 1 to " + MaxRows + ", got \"" + limitText + "\".");
  limit = Math.Min(limit, MaxRows);

  List<ElementType> types = new FilteredElementCollector(document).OfCategory(category).WhereElementIsElementType()
      .OfType<ElementType>()
      .OrderBy(t => t.FamilyName, StringComparer.CurrentCultureIgnoreCase)
      .ThenBy(t => t.Name, StringComparer.CurrentCultureIgnoreCase)
      .ToList();
  var items = types.Take(limit).Select(t => new { Id = idOf(t.Id), Family = t.FamilyName, Name = t.Name }).ToList();

  return new
  {
      Status = "Ok",
      Category = categoryName,
      Total = types.Count,
      Items = items,
      Returned = items.Count,
      Truncated = types.Count > items.Count
  };
parameters:
  - name: category
    type: string
    description: OST_* name of the category, such as OST_Walls, OST_Doors or OST_Floors
    source: designer
    required: true
  - name: limit
    type: int
    description: Most rows to return (1 to 200)
    source: default
    required: false
    default: 100
preconditions: []
not_for:
  - "create type"
  - "duplicate type"
  - "change type"
applies_when:
  - "list types"
  - "which types"
  - "available types"
  - "type ids"
validator:
  kind: count_delta
  category: "{category}"
  expected: 0
fixtures:
  - name: basic
    params: {category: "OST_Walls"}
    expect: {Status: "Ok"}
  - name: short
    params: {category: "OST_Doors", limit: 20}
    expect: {Status: "Ok"}
approved_by: null
approved_at: null
created_at: "2026-11-23T00:00:00"
source_query: list the types of a category
