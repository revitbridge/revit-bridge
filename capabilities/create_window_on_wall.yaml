schema_version: 1
name: create_window_on_wall
display_name: Place Window Along Wall
description: >-
  Place one window in a basic wall at a given distance along its straight or circular location curve.
  Use a loaded type name or Family: Type. The wall's base level is used unless another level is given.
  Dimensions are in mm. Set flip to reverse facing.
version: "1.0.0"
revit_versions: ["2021", "2023", "2024", "2025", "2026", "2027"]
code_template: |
  // A refusal (nothing is kept; the designer can fix the input) throws an InvalidOperationException
  // whose message starts with "REFUSED: "; any other exception is a failure of this pack. Either way
  // the add-in rolls its transaction back. The bridge opened that transaction; none is opened here.
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<string, string, double> toFeet = (label, text) =>
  {
      double mm;
      if (!double.TryParse(text, System.Globalization.NumberStyles.Float, invariant, out mm)
          || double.IsNaN(mm) || double.IsInfinity(mm))
          throw new InvalidOperationException("REFUSED: " + label + " must be a number in mm, got \"" + text + "\".");
      return UnitUtils.ConvertToInternalUnits(mm, UnitTypeId.Millimeters);
  };
  Func<double, double> toMm = feet => Math.Round(UnitUtils.ConvertFromInternalUnits(feet, UnitTypeId.Millimeters), 1);
  Func<ElementId, long> idOf = id => long.Parse(id.ToString(), invariant);
  Func<Element, BuiltInParameter, BuiltInParameter, Parameter> lengthOf = (e, first, second) =>
  {
      Parameter p = e.get_Parameter(first);
      if (p == null || !p.HasValue || p.StorageType != StorageType.Double)
          p = e.get_Parameter(second);
      return p != null && p.HasValue && p.StorageType == StorageType.Double ? p : null;
  };
  string wallText = "{wall_id}";
  string typeName = "{type_name}";
  double tolerance = document.Application.ShortCurveTolerance;
  // A value read back within this of what was set counts as kept (feet, about 0.0003 mm).
  const double ReadBackTolerance = 1e-6;

  // 1. The host wall, by id: it must exist, be a wall, and be a basic wall with a location line.
  long wallNumber;
  if (!long.TryParse(wallText, System.Globalization.NumberStyles.None, invariant, out wallNumber) || wallNumber <= 0)
      throw new InvalidOperationException("REFUSED: Supply a positive host wall id.");
  // The enum's underlying integer and the ElementId constructor widened together in 2024.
  var nativeId = (BuiltInCategory)wallNumber - (BuiltInCategory)0;
  if ((long)nativeId != wallNumber)
      throw new InvalidOperationException("REFUSED: The host wall id exceeds this Revit version's range.");
  #pragma warning disable 618
  Wall wall = document.GetElement(new ElementId(nativeId)) as Wall;
  #pragma warning restore 618
  if (wall == null)
      throw new InvalidOperationException("REFUSED: There is no wall with id " + wallText + " in this model. Pick a wall from the list.");
  if (wall.WallType.Kind != WallKind.Basic)
      throw new InvalidOperationException("REFUSED: Wall " + wallText + " is a "
          + (wall.WallType.Kind == WallKind.Curtain ? "curtain" : wall.WallType.Kind == WallKind.Stacked ? "stacked" : "special")
          + " wall; this tool places windows in basic walls only.");
  LocationCurve wallLocation = wall.Location as LocationCurve;
  if (wallLocation == null || wallLocation.Curve == null)
      throw new InvalidOperationException("REFUSED: Wall " + wallText + " has no location line.");
  string levelName = "{level_name}";
  Level level = levelName.Length == 0 ? document.GetElement(wall.LevelId) as Level :
      new FilteredElementCollector(document).OfClass(typeof(Level)).Cast<Level>().FirstOrDefault(l => l.Name == levelName);
  if (level == null && levelName.Length > 0)
      throw new InvalidOperationException("REFUSED: There is no level named " + levelName + ".");
  if (level == null)
      throw new InvalidOperationException("REFUSED: Wall " + wallText + " has no base level.");

  // 2. The window type, by name or "Family: Type", among loaded window types.
  var types = new FilteredElementCollector(document).OfClass(typeof(FamilySymbol))
      .OfCategory(BuiltInCategory.OST_Windows).Cast<FamilySymbol>()
      .Where(s => s.Name == typeName || s.FamilyName + ": " + s.Name == typeName)
      .ToList();
  if (types.Count == 0)
      throw new InvalidOperationException("REFUSED: No loaded window type is named \"" + typeName + "\". Pick a window type from the list, or load its family first.");
  if (types.Count > 1)
      throw new InvalidOperationException("REFUSED: " + types.Count + " window types are named \"" + typeName + "\" (families: "
          + string.Join(", ", types.Select(s => s.FamilyName).Distinct()) + "). Give the type as \"Family: Type\".");
  FamilySymbol symbol = types[0];
  if (symbol.Family.FamilyPlacementType != FamilyPlacementType.OneLevelBasedHosted)
      throw new InvalidOperationException("REFUSED: Window type \"" + typeName + "\" is not a window that is placed in a wall; pick a wall-hosted window type.");

  // 3. The point: on the wall (within its thickness of the location line), not past its ends.

  double sill = toFeet("Sill height", "{sill_height}");
  if (sill < 0)
      throw new InvalidOperationException("REFUSED: The sill height must be zero or more mm above the level.");
  Curve line = wallLocation.Curve;
  double distance = toFeet("Distance along the wall", "{offset_along_wall}");
  if (distance < 0 || distance > line.Length || (!(line is Line) && !(line is Arc)))
      throw new InvalidOperationException("REFUSED: Give a distance within the length of a straight or circular-arc host wall.");
  XYZ onWall = line.Evaluate(distance / line.Length, true);
  double toStart = distance;
  double toEnd = line.Length - distance;
  Parameter widthParameter = lengthOf(symbol, BuiltInParameter.WINDOW_WIDTH, BuiltInParameter.FAMILY_WIDTH_PARAM);
  double halfWidth = widthParameter != null ? widthParameter.AsDouble() / 2.0 : 0.0;
  if (Math.Min(toStart, toEnd) < halfWidth + tolerance)
      throw new InvalidOperationException("REFUSED: The window does not fit there: the point is " + toMm(Math.Min(toStart, toEnd))
          + " mm from an end of wall " + wallText + (widthParameter != null ? " and the window is " + toMm(2 * halfWidth) + " mm wide." : "."));

  // 4. Vertically: sill and head inside the wall's extent, when the wall's box is known; the head
  // only when the type's height is readable too (on Revit 2026 the window's insertion Z was the
  // level's ProjectElevation plus the sill). ProjectElevation is the level's height in model
  // coordinates (the box's) whatever the level type's elevation base.
  Parameter heightParameter = lengthOf(symbol, BuiltInParameter.WINDOW_HEIGHT, BuiltInParameter.FAMILY_HEIGHT_PARAM);
  BoundingBoxXYZ wallBox = wall.get_BoundingBox(null);
  if (wallBox == null)
      throw new InvalidOperationException("REFUSED: Cannot verify the requested window elevation on the host wall.");
  double bottom = level.ProjectElevation + sill;
  if (bottom < wallBox.Min.Z - tolerance)
      throw new InvalidOperationException("REFUSED: A sill " + toMm(sill) + " mm above level " + level.Name + " is below the bottom of wall " + wallText + ".");
  if (bottom >= wallBox.Max.Z - tolerance)
      throw new InvalidOperationException("REFUSED: A sill " + toMm(sill) + " mm above level " + level.Name + " is at or above the top of wall " + wallText + ". Lower the sill.");
  if (heightParameter != null && bottom + heightParameter.AsDouble() > wallBox.Max.Z + tolerance)
      throw new InvalidOperationException("REFUSED: The window does not fit: its head would be " + toMm(bottom + heightParameter.AsDouble() - wallBox.Max.Z)
          + " mm above the top of wall " + wallText + ". Lower the sill or pick a shorter type.");

  // 5. Place it, set and read back the sill, check that the wall hosts it.
  if (!symbol.IsActive)
  {
      symbol.Activate();
      document.Regenerate();
  }
  FamilyInstance window = document.Create.NewFamilyInstance(new XYZ(onWall.X, onWall.Y, bottom), symbol, wall, level,
      Autodesk.Revit.DB.Structure.StructuralType.NonStructural);
  if (window == null)
      throw new InvalidOperationException("Revit returned no window; nothing was created.");
  document.Regenerate();
  if (window.Host == null || !window.Host.Id.Equals(wall.Id))
      throw new InvalidOperationException("Revit did not place the window in wall " + wallText + "; nothing was created.");
  Parameter sillParameter = window.get_Parameter(BuiltInParameter.INSTANCE_SILL_HEIGHT_PARAM);
  if (sillParameter == null || sillParameter.IsReadOnly)
      throw new InvalidOperationException("The window's sill height cannot be set; nothing was created.");
  if (!sillParameter.HasValue || Math.Abs(sillParameter.AsDouble() - sill) > ReadBackTolerance)
  {
      if (!sillParameter.Set(sill))
          throw new InvalidOperationException("Revit refused the sill height " + toMm(sill) + " mm; nothing was created.");
      document.Regenerate();
  }
  if (!sillParameter.HasValue || Math.Abs(sillParameter.AsDouble() - sill) > ReadBackTolerance)
      throw new InvalidOperationException("Revit did not keep the sill height " + toMm(sill) + " mm; nothing was created.");

  if (bool.Parse("{flip}"))
  {
      if (!window.CanFlipFacing || !window.flipFacing())
          throw new InvalidOperationException("REFUSED: This family cannot flip its facing direction.");
  }
  return new
  {
      Status = "Created",
      ElementId = idOf(window.Id),
      HostId = idOf(wall.Id),
      TypeId = idOf(symbol.Id),
      Type = symbol.FamilyName + ": " + symbol.Name,
      Level = level.Name,
      XMm = toMm(onWall.X),
      YMm = toMm(onWall.Y),
      SillHeightMm = toMm(sillParameter.AsDouble()),
      WidthChecked = widthParameter != null,
      HeightChecked = heightParameter != null
  };
parameters:
  - name: wall_id
    type: integer
    description: Element id of the basic wall that hosts the window
    source: tool:elements
    choices_from: elements:OST_Walls
    required: true
  - name: type_name
    type: string
    description: 'Loaded window type name, or "Family: Type" when two families share the name'
    source: tool:family_types
    choices_from: family_types:OST_Windows
    required: true
  - name: sill_height
    type: double
    description: Sill height above the placement level (mm)
    unit: mm
    source: designer
    required: false
    default: 900
  - name: level_name
    type: string
    description: "Optional placement level."
    source: answer
    choices_from: levels
    required: false
    default: ""
  - name: offset_along_wall
    type: double
    description: "Distance from the wall start (mm)."
    unit: mm
    source: designer
    required: true
  - name: flip
    type: bool
    description: "Flip the facing direction."
    source: designer
    required: false
    default: false
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Windows
  - text: "the host must be a basic wall (not curtain or stacked); the sill is measured from the placement level"
not_for:
  - "curtain wall"
  - "window type"
  - "move window"
  - "door"
applies_when:
  - "place window at a distance along a wall"
  - "locate window relative to the start of a wall"
validator:
  kind: count_delta
  category: OST_Windows
  expected: 1
fixtures:
  - name: by_distance
    params: {"wall_id":101,"type_name":"Fixed","level_name":"L1","offset_along_wall":1500,"flip":true,"sill_height":900}
    expect: {"Status":"Created"}
  - name: default_level_and_sill
    params: {wall_id: 101, type_name: "Fixed", offset_along_wall: 1500}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-11-23T00:00:00"
source_query: place a window in a wall
