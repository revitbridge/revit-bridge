schema_version: 1
name: create_column
display_name: Create Column (L1, 600 x 750mm)
description: Place one structural column of family 'M_Concrete-Rectangular-Column' type '600 x 750mm'
  at (100, 0) mm on level 'L1'. Everything is fixed in the code; solidified from a chat run.
version: 1.0.0
revit_versions:
- '2026'
code_template: |-
  // Step 1: Parse the position — convert mm to feet (Revit internal units)
  double xFeet = 100.0 / 304.8;  // 100mm -> feet
  double yFeet = 0.0 / 304.8;    // 0mm -> feet
  double zFeet = 0.0;

  // Step 2: Find the Level "L1" — filter by exact name from user selection
  Level level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "L1");

  if (level == null)
      return new { Status = "Error", Message = "Level 'L1' not found." };

  // Step 3: Find the FamilySymbol "600 x 750mm" in family "M_Concrete-Rectangular-Column"
  FamilySymbol columnSymbol = new FilteredElementCollector(document)
      .OfClass(typeof(FamilySymbol))
      .Cast<FamilySymbol>()
      .FirstOrDefault(s => s.Family.Name == "M_Concrete-Rectangular-Column" && s.Name == "600 x 750mm");

  if (columnSymbol == null)
      return new { Status = "Error", Message = "FamilySymbol '600 x 750mm' not found in family 'M_Concrete-Rectangular-Column'." };

  // Step 4: Activate the FamilySymbol if not already active — required before placing instances
  if (!columnSymbol.IsActive)
  {
      columnSymbol.Activate();
      document.Regenerate();
  }

  // Step 5: Define the insertion point in Revit internal units (feet)
  XYZ insertionPoint = new XYZ(xFeet, yFeet, zFeet);

  // Step 6: Place the structural column using NewFamilyInstance with StructuralType.Column
  FamilyInstance columnInstance = document.Create.NewFamilyInstance(
      insertionPoint,
      columnSymbol,
      level,
      Autodesk.Revit.DB.Structure.StructuralType.Column);

  if (columnInstance == null)
      return new { Status = "Error", Message = "Failed to create structural column instance." };

  // Step 7: Return result with element info
  return new
  {
      Status = "Success",
      ElementId = columnInstance.Id.Value,
      FamilyName = columnSymbol.Family.Name,
      TypeName = columnSymbol.Name,
      Level = level.Name,
      PositionX_mm = 100.0,
      PositionY_mm = 0.0
  };
parameters: []
preconditions:
- kind: levels_min
  value: 1
- kind: category_present
  category: OST_StructuralColumns
- text: 'level ''L1'' and family type ''M_Concrete-Rectangular-Column : 600 x 750mm'' must exist'
not_for:
- a column anywhere else
- another column type
applies_when:
- structural column 600 x 750mm at 100,0 on L1
validator:
  kind: created_ids
  category: OST_StructuralColumns
fixtures: []
approved_by: null
approved_at: null
