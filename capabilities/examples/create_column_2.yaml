# Example only: a zero-parameter pack solidified from a chat run, with the family type,
# level and coordinates hard-coded in the C#. ToolStore loads only top-level capabilities/*.yaml,
# so nothing under capabilities/examples/ is ever registered as a tool.
schema_version: 1
name: create_column_2
display_name: Create Column (L1, 300 x 450mm)
description: Place one structural column of type '300 x 450mm' at (200, 0) mm on level 'L1'. Everything
  is fixed in the code; solidified from a chat run.
version: 1.0.0
revit_versions:
- '2026'
code_template: |-
  // Step 1: Find the FamilySymbol for the structural column type
  FamilySymbol columnSymbol = new FilteredElementCollector(document)
      .OfClass(typeof(FamilySymbol))
      .OfCategory(BuiltInCategory.OST_StructuralColumns)
      .Cast<FamilySymbol>()
      .FirstOrDefault(s => s.Name == "300 x 450mm");

  if (columnSymbol == null)
      return new { Status = "Error", Message = "FamilySymbol '300 x 450mm' not found." };

  // Step 2: Activate the FamilySymbol if not already active
  if (!columnSymbol.IsActive)
  {
      columnSymbol.Activate();
      document.Regenerate();
  }

  // Step 3: Find the base level (L1 at elevation 0)
  Level baseLevel = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "L1");

  if (baseLevel == null)
      return new { Status = "Error", Message = "Level 'L1' not found." };

  // Step 4: Define the insertion point — 200mm = 200/304.8 feet
  double x = 200.0 / 304.8;
  double y = 0.0 / 304.8;
  double z = 0.0;
  XYZ insertionPoint = new XYZ(x, y, z);

  // Step 5: Place the structural column instance using NewFamilyInstance
  FamilyInstance column = document.Create.NewFamilyInstance(
      insertionPoint,
      columnSymbol,
      baseLevel,
      Autodesk.Revit.DB.Structure.StructuralType.Column);

  if (column == null)
      return new { Status = "Error", Message = "Failed to create column instance." };

  return new
  {
      Status = "Created",
      ElementId = column.Id.Value,
      FamilyName = columnSymbol.FamilyName,
      TypeName = columnSymbol.Name,
      Level = baseLevel.Name,
      PositionX_mm = 200,
      PositionY_mm = 0
  };
parameters: []
preconditions:
- kind: levels_min
  value: 1
- kind: category_present
  category: OST_StructuralColumns
- text: level 'L1' and a structural column type named '300 x 450mm' must exist
not_for:
- a column anywhere else
- another column type
applies_when:
- structural column 300 x 450mm at 200,0 on L1
validator:
  kind: created_ids
  category: OST_StructuralColumns
fixtures: []
