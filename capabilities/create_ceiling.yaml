schema_version: 1
name: create_ceiling
display_name: Create Ceiling
description: >-
  Create one ceiling (Revit 2023 or later) of a named type on a level. Use x, y, width and length for a rectangle or
  points for a closed polygon. Dimensions and elevations are in mm. Give height or offset relative to the level.
version: "1.0.0"
revit_versions: ["2023", "2024", "2025", "2026", "2027"]
code_template: |
  // A refusal (nothing is kept; the designer can fix the input) throws an InvalidOperationException
  // whose message starts with "REFUSED: "; any other exception is a failure of this pack. Either way
  // the add-in rolls its transaction back. The bridge opened that transaction; none is opened here.
  // Ceiling.Create exists from Revit 2022 (the add-in builds 2023 on): on 2021 this code does not
  // compile and nothing runs.
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<string, string, double> toFeet = (label, text) =>
  {
      double mm;
      if (!double.TryParse(text, System.Globalization.NumberStyles.Float, invariant, out mm)
          || double.IsNaN(mm) || double.IsInfinity(mm))
          throw new InvalidOperationException("REFUSED: " + label + " must be a number in mm, got \"" + text + "\".");
      return UnitUtils.ConvertToInternalUnits(mm, UnitTypeId.Millimeters);
  };
  Func<double, double> toMm = feet => Math.Round(UnitUtils.ConvertFromInternalUnits(feet, UnitTypeId.Millimeters), 1);
  Func<ElementId, long> idOf = id => long.Parse(id.ToString(), invariant);
  string levelName = "{level_name}";
  string typeName = "{type_name}";
  double tolerance = document.Application.ShortCurveTolerance;
  // A value read back within this of what was set counts as kept (feet, about 0.0003 mm).
  const double ReadBackTolerance = 1e-6;

  Level level = new FilteredElementCollector(document).OfClass(typeof(Level)).Cast<Level>()
      .FirstOrDefault(l => l.Name == levelName);
  if (level == null)
      throw new InvalidOperationException("REFUSED: There is no level named \"" + levelName + "\". Pick a level from the list.");
  var types = new FilteredElementCollector(document).OfClass(typeof(CeilingType)).Cast<CeilingType>()
      .Where(t => t.Name == typeName || t.FamilyName + ": " + t.Name == typeName)
      .ToList();
  if (types.Count == 0)
      throw new InvalidOperationException("REFUSED: There is no ceiling type named \"" + typeName + "\". Pick a ceiling type from the list.");
  if (types.Count > 1)
      throw new InvalidOperationException("REFUSED: " + types.Count + " ceiling types are named \"" + typeName + "\" (families: "
          + string.Join(", ", types.Select(t => t.FamilyName).Distinct()) + "). Give the type as \"Family: Type\".");
  CeilingType ceilingType = types[0];

  string heightText = "{height}";
  string offsetText = "{offset}";
  if (heightText.Length > 0 && offsetText.Length > 0)
      throw new InvalidOperationException("REFUSED: Give either height or offset above the level.");
  double height = toFeet("Height above the level", offsetText.Length > 0 ? offsetText : heightText);
  if (height < 0 && offsetText.Length == 0)
      throw new InvalidOperationException("REFUSED: The height above the level must be zero or more mm.");
  double z = level.ProjectElevation;
  string pointsText = "{points}";
  var corners = new List<XYZ>();
  double width, length;
  if (pointsText.Length > 0)
  {
      if (new string[] { "{x}", "{y}", "{width}", "{length}" }.Any(v => v.Length > 0))
          throw new InvalidOperationException("REFUSED: Supply a polygon or a rectangle, not both.");
      string[] pairs = pointsText.Split(';');
      if (pairs.Length < 3 || pairs.Length > 256)
          throw new InvalidOperationException("REFUSED: Give 3 to 256 polygon vertices as x,y; x,y; x,y.");
      foreach (string pair in pairs)
      {
          string[] xy = pair.Split(',');
          if (xy.Length != 2)
              throw new InvalidOperationException("REFUSED: Each polygon vertex must have an x and a y in mm.");
          corners.Add(new XYZ(toFeet("Vertex X", xy[0]), toFeet("Vertex Y", xy[1]), z));
      }
      width = corners.Max(p => p.X) - corners.Min(p => p.X);
      length = corners.Max(p => p.Y) - corners.Min(p => p.Y);
  }
  else
  {
      double x = toFeet("X", "{x}"), y = toFeet("Y", "{y}");
      width = toFeet("Width", "{width}");
      length = toFeet("Length", "{length}");
      if (width <= tolerance || length <= tolerance)
          throw new InvalidOperationException("REFUSED: Width and length must both be more than zero mm.");
      corners.AddRange(new[] { new XYZ(x, y, z), new XYZ(x + width, y, z),
          new XYZ(x + width, y + length, z), new XYZ(x, y + length, z) });
  }
  if (!corners.All(p => XYZ.IsWithinLengthLimits(p) && XYZ.IsWithinLengthLimits(new XYZ(p.X, p.Y, z + height))))
      throw new InvalidOperationException("REFUSED: The outline reaches outside the model's limits.");
  var edges = new List<Curve>();
  for (int i = 0; i < corners.Count; i++)
  {
      XYZ start = corners[i], end = corners[(i + 1) % corners.Count];
      if (start.DistanceTo(end) <= tolerance)
          throw new InvalidOperationException("REFUSED: Two consecutive vertices are too close together.");
      edges.Add(Line.CreateBound(start, end));
  }

  Ceiling ceiling = Ceiling.Create(document, new List<CurveLoop> { CurveLoop.Create(edges) }, ceilingType.Id, level.Id);
  if (ceiling == null)
      throw new InvalidOperationException("Revit returned no ceiling; nothing was created.");
  Parameter offset = ceiling.get_Parameter(BuiltInParameter.CEILING_HEIGHTABOVELEVEL_PARAM);
  if (offset == null || offset.IsReadOnly)
      throw new InvalidOperationException("The ceiling's height above the level cannot be set; nothing was created.");
  if (!offset.Set(height))
      throw new InvalidOperationException("Revit refused the height " + toMm(height) + " mm; nothing was created.");
  document.Regenerate();
  if (!offset.HasValue || Math.Abs(offset.AsDouble() - height) > ReadBackTolerance)
      throw new InvalidOperationException("Revit did not keep the height " + toMm(height) + " mm; nothing was created.");

  return new
  {
      Status = "Created",
      ElementId = idOf(ceiling.Id),
      Level = level.Name,
      TypeId = idOf(ceilingType.Id),
      Type = ceilingType.FamilyName + ": " + ceilingType.Name,
      HeightMm = toMm(offset.AsDouble()),
      WidthMm = toMm(width),
      LengthMm = toMm(length)
  };
parameters:
  - name: level_name
    type: string
    description: Level the ceiling belongs to
    source: tool:levels
    choices_from: levels
    required: true
  - name: type_name
    type: string
    description: 'Ceiling type name, or "Family: Type" when two families share the name'
    source: tool:family_types
    choices_from: family_types:OST_Ceilings
    required: true
  - name: x
    type: double
    description: X of the rectangle's corner with the smallest X and Y (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: y
    type: double
    description: Y of the rectangle's corner with the smallest X and Y (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: width
    type: double
    description: Rectangle size along X (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: length
    type: double
    description: Rectangle size along Y (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: height
    type: double
    description: Height of the ceiling above the level (mm)
    unit: mm
    source: designer
    required: false
    default: ""
  - name: points
    type: string
    description: "Polygon outline in mm, as x,y; x,y; x,y, with an implicit closing edge."
    source: designer
    required: false
    default: ""
  - name: offset
    type: double
    description: "Vertical offset from the level (mm)."
    unit: mm
    source: designer
    required: false
    default: ""
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Ceilings
  - text: "Revit 2023 or later: the API has no way to create a ceiling before 2022 and the add-in has no 2022 build"
not_for:
  - "ceiling type"
  - "ceiling grid"
  - "move ceiling"
applies_when:
  - "create ceiling"
  - "add ceiling"
  - "place ceiling"
validator:
  kind: count_delta
  category: OST_Ceilings
  expected: 1
fixtures:
  - name: basic
    params: {level_name: "L1", type_name: "Generic", x: 0, y: 0, width: 6000, length: 8000, height: 2700}
    expect: {Status: "Created"}
  - name: polygon
    params: {"level_name":"L1","type_name":"Generic","points":"0,0; 5000,0; 4000,4000; 0,4000","offset":2000}
    expect: {"Status":"Created"}
approved_by: null
approved_at: null
created_at: "2026-11-23T00:00:00"
source_query: create a ceiling
