schema_version: 1
name: create_ceiling
display_name: Create Ceiling
description: >-
  Create one ceiling on a level from a rectangle given by its corner (x, y) and its
  width along X and length along Y, at a height above the level, all in mm. Needs Revit 2022 or
  later (the API cannot create ceilings before 2022). The ceiling type is a ceiling type name;
  when two families have a type of that name, give it as "Family: Type". Refusals (no such level
  or type, a width or length that is not more than zero, a negative height) stop the run and
  change nothing.
version: "1.0.0"
revit_versions: ["2022", "2023", "2024", "2025", "2026", "2027"]
code_template: |
  // Every refusal throws: the add-in then rolls its transaction back and reports the message.
  // The bridge already opened the transaction; none is opened here.
  // Ceiling.Create exists from Revit 2022: on 2021 this code does not compile and nothing runs.
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<string, string, double> toFeet = (label, text) =>
  {
      double mm;
      if (!double.TryParse(text, System.Globalization.NumberStyles.Float, invariant, out mm)
          || double.IsNaN(mm) || double.IsInfinity(mm))
          throw new InvalidOperationException(label + " must be a number in mm, got \"" + text + "\".");
      return UnitUtils.ConvertToInternalUnits(mm, UnitTypeId.Millimeters);
  };
  Func<double, double> toMm = feet => Math.Round(UnitUtils.ConvertFromInternalUnits(feet, UnitTypeId.Millimeters), 1);
  Func<ElementId, long> idOf = id => long.Parse(id.ToString(), invariant);
  string levelName = "{level_name}";
  string typeName = "{type_name}";
  double tolerance = document.Application.ShortCurveTolerance;
  // A value read back within this of what was set counts as kept (feet, about 0.0003 mm).
  const double ReadBackTolerance = 1e-6;

  Level level = new FilteredElementCollector(document).OfClass(typeof(Level)).Cast<Level>()
      .FirstOrDefault(l => l.Name == levelName);
  if (level == null)
      throw new InvalidOperationException("There is no level named \"" + levelName + "\". Pick a level from the list.");
  var types = new FilteredElementCollector(document).OfClass(typeof(CeilingType)).Cast<CeilingType>()
      .Where(t => t.Name == typeName || t.FamilyName + ": " + t.Name == typeName)
      .ToList();
  if (types.Count == 0)
      throw new InvalidOperationException("There is no ceiling type named \"" + typeName + "\". Pick a ceiling type from the list.");
  if (types.Count > 1)
      throw new InvalidOperationException(types.Count + " ceiling types are named \"" + typeName + "\" (families: "
          + string.Join(", ", types.Select(t => t.FamilyName).Distinct()) + "). Give the type as \"Family: Type\".");
  CeilingType ceilingType = types[0];

  double x = toFeet("X", "{x}");
  double y = toFeet("Y", "{y}");
  double width = toFeet("Width", "{width}");
  double length = toFeet("Length", "{length}");
  double height = toFeet("Height", "{height}");
  if (width <= tolerance || length <= tolerance)
      throw new InvalidOperationException("Width and length must both be more than zero mm.");
  if (height < 0)
      throw new InvalidOperationException("The height above the level must be zero or more mm.");
  double z = level.Elevation;
  XYZ[] corners =
  {
      new XYZ(x, y, z), new XYZ(x + width, y, z), new XYZ(x + width, y + length, z), new XYZ(x, y + length, z)
  };
  if (!corners.All(c => XYZ.IsWithinLengthLimits(c)) || !XYZ.IsWithinLengthLimits(new XYZ(x, y, z + height)))
      throw new InvalidOperationException("The ceiling reaches outside the model's limits.");
  var edges = new List<Curve>();
  for (int i = 0; i < 4; i++)
      edges.Add(Line.CreateBound(corners[i], corners[(i + 1) % 4]));

  Ceiling ceiling = Ceiling.Create(document, new List<CurveLoop> { CurveLoop.Create(edges) }, ceilingType.Id, level.Id);
  Parameter offset = ceiling.get_Parameter(BuiltInParameter.CEILING_HEIGHTABOVELEVEL_PARAM);
  if (offset == null || offset.IsReadOnly)
      throw new InvalidOperationException("The ceiling's height above the level cannot be set; nothing was created.");
  if (!offset.Set(height))
      throw new InvalidOperationException("Revit refused the height " + toMm(height) + " mm; nothing was created.");
  document.Regenerate();
  if (!offset.HasValue || Math.Abs(offset.AsDouble() - height) > ReadBackTolerance)
      throw new InvalidOperationException("Revit did not keep the height " + toMm(height) + " mm; nothing was created.");

  return new
  {
      Status = "Created",
      ElementId = idOf(ceiling.Id),
      Level = level.Name,
      TypeId = idOf(ceilingType.Id),
      Type = ceilingType.FamilyName + ": " + ceilingType.Name,
      HeightMm = toMm(offset.AsDouble()),
      WidthMm = toMm(width),
      LengthMm = toMm(length)
  };
parameters:
  - name: level_name
    type: string
    description: Level the ceiling belongs to
    source: tool:levels
    choices_from: levels
    required: true
  - name: type_name
    type: string
    description: 'Ceiling type name, or "Family: Type" when two families share the name'
    source: tool:family_types
    choices_from: family_types:OST_Ceilings
    required: true
  - name: x
    type: double
    description: X of the rectangle's corner with the smallest X and Y (mm)
    unit: mm
    source: designer
    required: true
  - name: y
    type: double
    description: Y of the rectangle's corner with the smallest X and Y (mm)
    unit: mm
    source: designer
    required: true
  - name: width
    type: double
    description: Rectangle size along X (mm)
    unit: mm
    source: designer
    required: true
  - name: length
    type: double
    description: Rectangle size along Y (mm)
    unit: mm
    source: designer
    required: true
  - name: height
    type: double
    description: Height of the ceiling above the level (mm)
    unit: mm
    source: designer
    required: true
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_Ceilings
  - text: "Revit 2022 or later: the API has no way to create a ceiling before 2022"
not_for:
  - "ceiling type"
  - "ceiling grid"
  - "move ceiling"
applies_when:
  - "create ceiling"
  - "add ceiling"
  - "place ceiling"
validator:
  kind: count_delta
  category: OST_Ceilings
  expected: 1
fixtures:
  - name: basic
    params: {level_name: "L1", type_name: "Generic", x: 0, y: 0, width: 6000, length: 8000, height: 2700}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-11-23T00:00:00"
source_query: create a ceiling
