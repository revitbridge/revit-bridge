schema_version: 1
name: query_model_stats
display_name: Query Model Statistics
description: Count model elements by category (read-only).
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Collect all model elements grouped by category
  var elements = new FilteredElementCollector(document)
      .WhereElementIsNotElementType()
      .Where(e => e.Category != null)
      .GroupBy(e => e.Category.Name)
      .Select(g => new { Category = g.Key, Count = g.Count() })
      .OrderByDescending(x => x.Count)
      .ToList();

  return elements;
parameters: []
preconditions: []
not_for:
  - "count one category"
applies_when:
  - "model statistics"
  - "how many elements"
  - "count by category"
validator:
