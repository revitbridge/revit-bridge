schema_version: 1
name: get_element_geometry
display_name: Get Element Geometry
description: "Read linear location geometry by element id or from the current selection. Positions and lengths are in mm, direction vectors are unitless."
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  Func<string, Element> elementById = text =>
  {
      long id;
      if (!long.TryParse(text, out id) || id <= 0)
          throw new InvalidOperationException("REFUSED: Expected a positive element id: " + text);
      Element result = document.GetElement(new ElementId(id));
      if (result == null)
          throw new InvalidOperationException("REFUSED: Element no longer exists: " + text);
      return result;
  };

  string idText = "{element_id}";
  var ids = idText == "" ? new UIDocument(document).Selection.GetElementIds().ToList() : new List<ElementId> { elementById(idText).Id };
  if (ids.Count == 0 || ids.Count > 50)
      throw new InvalidOperationException("REFUSED: Supply an element id or select 1 to 50 elements.");
  Func<XYZ, double[]> vector = p => new double[] { p.X, p.Y, p.Z };
  Func<double, double> mm = x => UnitUtils.ConvertFromInternalUnits(x, UnitTypeId.Millimeters);
  Func<XYZ, double[]> point = p => new double[] { mm(p.X), mm(p.Y), mm(p.Z) };
  var items = new List<object>();
  var skipped = new List<object>();
  foreach (ElementId id in ids)
  {
      try
      {
          Element element = document.GetElement(id);
          Curve curve = (element?.Location as LocationCurve)?.Curve;
          if (curve == null || !curve.IsBound)
          {
              skipped.Add(new { Id = id.Value, Reason = "No bounded location curve." });
              continue;
          }
          XYZ direction = curve.ComputeDerivatives(0.5, true).BasisX.Normalize();
          XYZ normal = XYZ.BasisZ.CrossProduct(direction).Normalize();
          items.Add(new { Id = id.Value, Start = point(curve.GetEndPoint(0)), End = point(curve.GetEndPoint(1)),
              Mid = point(curve.Evaluate(0.5, true)), Direction = vector(direction),
              NormalLeft = normal.IsZeroLength() ? null : vector(normal),
              LengthMm = mm(curve.Length), Level = (document.GetElement(element.LevelId) as Level)?.Name });
      }
      catch (Exception ex) { skipped.Add(new { Id = id.Value, Reason = ex.Message }); }
  }
  if (items.Count == 0)
      throw new InvalidOperationException("REFUSED: No readable linear geometry: " + string.Join(", ", skipped));
  return new { Status = "Ok", Items = items, Skipped = skipped };
parameters:
  - name: element_id
    type: integer
    description: "Element id, omit to read the current selection"
    source: default
    required: false
    default: ""
preconditions:
  - text: An explicit element or selection must have a location curve.
not_for:
  - "solid geometry"
  - "create wall"
applies_when:
  - "read element endpoints midpoint direction and normal"
validator: null
fixtures:
  - name: by_id
    params: {element_id: 101}
    expect: {Status: Ok}
  - name: selection
    params: {}
    expect: {Status: Ok}
approved_by: null
approved_at: null
created_at: "2026-11-25T00:00:00"
source_query: read element endpoints midpoint direction and normal
