schema_version: 1
name: list_elements
display_name: List Elements
description: "List element instances by category with optional exact level and type filters."
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  Func<string, Level> levelByName = name =>
  {
      Level result = new FilteredElementCollector(document).OfClass(typeof(Level)).Cast<Level>()
          .FirstOrDefault(l => l.Name == name);
      if (result == null)
          throw new InvalidOperationException("REFUSED: No level named " + name);
      return result;
  };

  string categoryText = "{category}", levelName = "{level_name}", typeName = "{type_name}";
  BuiltInCategory category;
  if (!categoryText.StartsWith("OST_", StringComparison.Ordinal) || !Enum.TryParse(categoryText, out category)
      || !Enum.IsDefined(typeof(BuiltInCategory), category) || Category.GetCategory(document, category) == null)
      throw new InvalidOperationException("REFUSED: Unknown category: " + categoryText);
  int limit;
  if (!int.TryParse("{limit}", out limit) || limit < 1 || limit > 200)
      throw new InvalidOperationException("REFUSED: Limit must be a whole number from 1 to 200.");
  Level level = levelName == "" ? null : levelByName(levelName);
  HashSet<ElementId> types = null;
  if (typeName != "")
  {
      types = new HashSet<ElementId>(new FilteredElementCollector(document).OfCategory(category)
          .WhereElementIsElementType().OfType<ElementType>()
          .Where(t => t.Name == typeName || t.FamilyName + ": " + t.Name == typeName).Select(t => t.Id));
      if (types.Count == 0) throw new InvalidOperationException("REFUSED: No such type in category: " + typeName);
  }
  var items = new List<object>();
  var skipped = new List<object>();
  bool truncated = false;
  var elements = new FilteredElementCollector(document).OfCategory(category).WhereElementIsNotElementType();
  if (level != null) elements.WherePasses(new ElementLevelFilter(level.Id));
  if (types != null)
  {
      var typeParameter = new ElementId(BuiltInParameter.ELEM_TYPE_PARAM);
      var filters = types.Select(typeId => (ElementFilter)new ElementParameterFilter(
          ParameterFilterRuleFactory.CreateEqualsRule(typeParameter, typeId))).ToList();
      elements.WherePasses(filters.Count == 1 ? filters[0] : new LogicalOrFilter(filters));
  }
  foreach (Element e in elements)
  {
      try
      {
          if (items.Count == limit) { truncated = true; break; }
          var t = document.GetElement(e.GetTypeId()) as ElementType;
          items.Add(new { Id = e.Id.Value, Type = t?.Name, Family = t?.FamilyName, Level = (document.GetElement(e.LevelId) as Level)?.Name });
      }
      catch (Exception ex) { skipped.Add(new { Id = e.Id.Value, Reason = ex.Message }); }
  }
  return new { Status = "Ok", Items = items, Truncated = truncated, Skipped = skipped };
parameters:
  - name: category
    type: string
    description: BuiltInCategory identifier such as OST_Walls
    source: designer
    required: true
  - name: level_name
    type: string
    description: Optional exact level name
    source: answer
    choices_from: levels
    required: false
    default: ""
  - name: type_name
    type: string
    description: Optional exact type name
    source: default
    required: false
    default: ""
  - name: limit
    type: integer
    description: "Maximum returned rows (1 to 200)"
    source: default
    required: false
    default: 50
preconditions:
  - text: A model document must be open.
not_for:
  - "linked elements"
  - "element types"
applies_when:
  - "list elements of a category"
validator:
  kind: count_delta
  category: "{category}"
  expected: 0
fixtures:
  - name: walls
    params: {category: OST_Walls}
    expect: {Status: Ok}
approved_by: null
approved_at: null
created_at: "2026-11-25T00:00:00"
source_query: list elements of a category
