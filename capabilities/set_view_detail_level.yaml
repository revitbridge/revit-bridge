schema_version: 1
name: set_view_detail_level
display_name: Set View Detail Level
description: "Set the detail level of the active or named view. This changes the view and can be undone in Revit."
version: "1.0.0"
revit_versions: ["2021", "2023", "2024", "2025", "2026", "2027"]
code_template: |
  string viewName = "{view_name}";
  View view = document.ActiveView;
  if (viewName.Length != 0)
  {
      const int limit = 8;
      var timer = System.Diagnostics.Stopwatch.StartNew();
      var available = new List<string>();
      var matches = new List<string>();
      using (var views = new FilteredElementCollector(document).OfClass(typeof(View)))
      {
          foreach (View candidate in views)
          {
              if (timer.ElapsedMilliseconds > 1500)
                  throw new InvalidOperationException("REFUSED: View lookup took too long. Open the intended view and omit view_name.");
              string name = candidate.Name;
              bool match = string.Equals(name, viewName, StringComparison.OrdinalIgnoreCase);
              if (!match && available.Count == limit) continue;
              string label = name + " (" + candidate.ViewType + ")";
              if (available.Count < limit) available.Add(label);
              if (!match) continue;
              matches.Add(label);
              view = candidate;
              if (matches.Count > limit) break;
          }
      }
      if (matches.Count == 0)
          throw new InvalidOperationException("REFUSED: No view named '" + viewName + "'. Check the exact name. Available views (up to 8): "
              + (available.Count == 0 ? "none" : string.Join(", ", available)) + ".");
      if (matches.Count > 1)
          throw new InvalidOperationException("REFUSED: Ambiguous view name '" + viewName + "'. Open the intended view and omit view_name. Matches: "
              + string.Join(", ", matches.Take(limit)) + (matches.Count > limit ? ", ..." : "."));
  }
  if (view == null)
      throw new InvalidOperationException("REFUSED: No active view. Open a view or supply its exact name.");
  if (view.IsTemplate)
      throw new InvalidOperationException("REFUSED: '" + view.Name + "' is a view template. Choose a project view.");

  var template = document.GetElement(view.ViewTemplateId) as View;
  if (template != null)
  {
      var id = new ElementId(BuiltInParameter.VIEW_DETAIL_LEVEL);
      if (template.GetTemplateParameterIds().Contains(id) && !template.GetNonControlledTemplateParameterIds().Contains(id))
          throw new InvalidOperationException("REFUSED: View template '" + template.Name + "' controls the detail level. Change it there or detach the template in Revit.");
  }
  if (!view.HasDetailLevel() || !view.CanModifyDetailLevel())
      throw new InvalidOperationException("REFUSED: The detail level of '" + view.Name + "' (" + view.ViewType + ") cannot be changed. Choose a view with an editable detail level.");

  string requested = "{detail_level}";
  ViewDetailLevel level;
  switch (requested)
  {
      case "coarse": level = ViewDetailLevel.Coarse; break;
      case "medium": level = ViewDetailLevel.Medium; break;
      case "fine": level = ViewDetailLevel.Fine; break;
      default: throw new InvalidOperationException("REFUSED: Unknown detail level. Choose coarse, medium or fine.");
  }
  var previous = view.DetailLevel;
  view.DetailLevel = level;
  var current = view.DetailLevel;
  if (current != level)
      throw new InvalidOperationException("REFUSED: Revit did not apply the detail level. Check the view properties in Revit.");
  return new { View = view.Name, PreviousLevel = previous.ToString().ToLowerInvariant(), NewLevel = current.ToString().ToLowerInvariant() };
parameters:
  - name: detail_level
    type: string
    description: "Choose coarse, medium or fine."
    source: designer
    required: true
  - name: view_name
    type: string
    description: "Exact view name in the current document, matched without case sensitivity. Omit to use the active view."
    source: designer
    required: false
    default: ""
preconditions:
  - text: "Choose a project view whose detail level can be edited."
applies_when:
  - "set view detail level"
validator: null
fixtures:
  - name: active_coarse
    params: {"detail_level":"coarse"}
    expect: {"NewLevel":"coarse"}
  - name: named_fine
    params: {"detail_level":"fine","view_name":"Named"}
    expect: {"View":"Named","NewLevel":"fine"}
