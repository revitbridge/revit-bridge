schema_version: 1
name: delete_elements_by_category
display_name: Delete Elements By Category
description: Delete every instance of one built-in category (e.g. OST_Walls). The designer
  confirms how many elements that is; the validator checks the count moved by exactly
  that much.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Collect elements by category
  var category = (BuiltInCategory)Enum.Parse(typeof(BuiltInCategory), "{category}");
  var elements = new FilteredElementCollector(document)
      .OfCategory(category)
      .WhereElementIsNotElementType()
      .ToList();

  if (elements.Count == 0)
      return new { Status = "NoElements", Message = "No elements found in category {category}" };

  // Step 2: Delete all found elements
  int deleted = 0;
  foreach (var elem in elements)
  {
      document.Delete(elem.Id);
      deleted++;
  }

  return new { Status = "Deleted", Count = deleted, Category = "{category}" };
parameters:
  - name: category
    type: string
    description: BuiltInCategory name (e.g. OST_Walls, OST_StructuralColumns, OST_Floors)
    source: answer
    required: true
  - name: delta
    type: integer
    description: Expected change in the element count of that category, negative for a
      deletion (e.g. -5 when query counts reports 5). Take it from a query and let the
      designer confirm it.
    source: answer
    required: true
preconditions:
  - text: "irreversible: every instance of the category is deleted; confirm the count with query(\"counts\") first"
not_for:
  - "delete one element"
  - "delete selected"
applies_when:
  - "delete all"
  - "remove every"
  - "clear the category"
validator:
  kind: count_delta
  category: "{category}"
  expected: "{delta}"
fixtures: []
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: delete all walls
