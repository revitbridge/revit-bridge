schema_version: 1
name: create_structural_column
display_name: Create Structural Column
description: Create a structural column of a named family type at X/Y on a level.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // Step 1: Get structural column family symbol by name
  var symbol = new FilteredElementCollector(document)
      .OfClass(typeof(FamilySymbol))
      .OfCategory(BuiltInCategory.OST_StructuralColumns)
      .Cast<FamilySymbol>()
      .FirstOrDefault(s => s.Name == "{type_name}");
  if (symbol == null)
      return new { Status = "Error", Message = "Column type '{type_name}' not found" };
  if (!symbol.IsActive) symbol.Activate();

  // Step 2: Get level by name
  var level = new FilteredElementCollector(document)
      .OfClass(typeof(Level))
      .Cast<Level>()
      .FirstOrDefault(l => l.Name == "{level_name}");
  if (level == null)
      return new { Status = "Error", Message = "Level '{level_name}' not found" };

  // Step 3: Create column at position (mm -> feet)
  XYZ location = new XYZ({x} / 304.8, {y} / 304.8, 0);
  var column = document.Create.NewFamilyInstance(
      location, symbol, level,
      Autodesk.Revit.DB.Structure.StructuralType.Column);

  return new { ElementId = column.Id.Value, Status = "Created",
               FamilyType = symbol.Name, Level = level.Name };
parameters:
  - name: type_name
    type: string
    description: Structural column family type name
    source: tool:family_types
    choices_from: family_types:OST_StructuralColumns
    required: true
  - name: level_name
    type: string
    description: Base level name
    source: tool:levels
    choices_from: levels
    required: true
  - name: x
    type: double
    description: Column X position (mm)
    unit: mm
    source: designer
    required: true
  - name: y
    type: double
    description: Column Y position (mm)
    unit: mm
    source: designer
    required: true
preconditions:
  - kind: levels_min
    value: 1
  - kind: category_present
    category: OST_StructuralColumns
  - text: "structural column families must be loaded"
not_for:
  - "architectural columns"
applies_when:
  - "structural column at coordinates"
  - "create column"
  - "place column"
validator:
  kind: created_ids
  category: OST_StructuralColumns
fixtures:
  - name: basic
    params: {type_name: "UC305x305x97", level_name: "L1", x: 0, y: 0}
    expect: {Status: "Created"}
approved_by: null
approved_at: null
created_at: "2026-03-13T00:00:00"
source_query: create a structural column
