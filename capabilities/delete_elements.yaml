schema_version: 1
name: delete_elements
display_name: Delete Elements
description: >-
  Delete the supplied ids (at most 100). Every supplied element is checked
  first; pinned elements, element types (deleting one deletes all its instances), views and
  levels stop the run and nothing is deleted. Unlisted dependent model hosts and family instances
  stop the deletion. AlsoDeleted lists the first 100 additional ids (such as sketches and tags);
  AlsoDeletedCount reports the total. If classification exceeds the time budget,
  the operation rolls back. Returns
  the ids deleted; there is no validator, the tool checks that every one is gone.
version: "1.0.0"
revit_versions: ["2026"]
code_template: |
  // A refusal (nothing is kept; the designer can fix the input) throws an InvalidOperationException
  // whose message starts with "REFUSED: "; any other exception is a failure of this pack. Either way
  // the add-in rolls its transaction back. The bridge opened that transaction; none is opened here.
  var invariant = System.Globalization.CultureInfo.InvariantCulture;
  Func<ElementId, long> idOf = id => long.Parse(id.ToString(), invariant);
  const int MaxSelected = 100;

  string idsText = "{element_ids}";
  List<ElementId> selected;
  if (string.IsNullOrWhiteSpace(idsText))
      throw new InvalidOperationException("REFUSED: Give the element ids to delete.");
  {
      selected = new List<ElementId>();
      string[] parts = idsText.Split(',');
      if (parts.Length > MaxSelected)
          throw new InvalidOperationException("REFUSED: Give at most 100 element ids.");
      foreach (string part in parts)
      {
          long number;
          if (!long.TryParse(part.Trim(), System.Globalization.NumberStyles.None, invariant, out number) || number <= 0)
              throw new InvalidOperationException("REFUSED: Invalid element id " + part + ".");
          #pragma warning disable 618
          var id = new ElementId(number);
          #pragma warning restore 618
          if (selected.Contains(id))
              throw new InvalidOperationException("REFUSED: Duplicate element id " + part + ".");
          selected.Add(id);
      }
  }
  var requested = new HashSet<ElementId>(selected);
  var problems = new List<string>();
  foreach (ElementId id in selected)
  {
      Element element = document.GetElement(id);
      if (element == null) { problems.Add(idOf(id) + " no longer exists"); continue; }
      if (element is ElementType) { problems.Add(idOf(id) + " is a type; deleting it would delete every element of that type"); continue; }
      if (element is View) { problems.Add(idOf(id) + " is a view"); continue; }
      if (element is Level) { problems.Add(idOf(id) + " is a level; deleting it would delete everything on it"); continue; }
      if (element.Pinned) { problems.Add(idOf(id) + " is pinned; unpin it in Revit first"); continue; }
  }
  if (problems.Count > 0)
      throw new InvalidOperationException("REFUSED: Nothing was deleted: " + problems.Count + " of " + selected.Count + " supplied ids cannot be deleted by this tool. "
          + string.Join("; ", problems.Take(5)) + (problems.Count > 5 ? "; and " + (problems.Count - 5) + " more." : "."));

  // Deleted elements cannot be opened afterwards. Snapshot model host/instance IDs with quick
  // filters before the single deletion. Only candidates outside Settings.Categories need opening.
  var clock = System.Diagnostics.Stopwatch.StartNew();
  void CheckBudget()
  {
      if (clock.ElapsedMilliseconds >= 250)
          throw new InvalidOperationException("REFUSED: The model-instance check exceeded its time budget. No elements were deleted.");
  }
  var knownCategories = new List<ElementId>();
  var modelCategories = new List<ElementId>();
  foreach (Category category in document.Settings.Categories)
  {
      CheckBudget();
      if (category.CategoryType == CategoryType.Model) modelCategories.Add(category.Id);
      knownCategories.Add(category.Id);
  }
  var modelInstances = new HashSet<ElementId>();
  var unclassified = new HashSet<ElementId>();
  using (var classes = new ElementMulticlassFilter(new List<Type> { typeof(HostObject), typeof(FamilyInstance) }))
  {
      if (modelCategories.Count != 0)
      using (var filter = new ElementMulticategoryFilter(modelCategories))
      using (var collection = new FilteredElementCollector(document))
      using (var ids = collection.WherePasses(classes).WherePasses(filter).GetElementIdIterator())
      {
          while (ids.MoveNext()) { CheckBudget(); modelInstances.Add(ids.Current); }
      }
      using (var collection = new FilteredElementCollector(document))
      using (var outside = knownCategories.Count == 0 ? null : new ElementMulticategoryFilter(knownCategories, true))
      {
          collection.WherePasses(classes);
          if (outside != null) collection.WherePasses(outside);
          foreach (Element element in collection)
          {
              CheckBudget();
              ElementId id = element.Id;
              try
              {
                  Category category = element.Category;
                  if (category == null) unclassified.Add(id);
                  else if (category.CategoryType == CategoryType.Model) modelInstances.Add(id);
              }
              catch (Autodesk.Revit.Exceptions.InvalidOperationException) { unclassified.Add(id); }
          }
      }
  }
  CheckBudget();
  ICollection<ElementId> deleted;
  try { deleted = document.Delete(selected); }
  catch (Autodesk.Revit.Exceptions.ArgumentException ex) when (!(ex is Autodesk.Revit.Exceptions.ArgumentNullException))
  {
      throw new InvalidOperationException("REFUSED: Revit would not delete the supplied ids: " + ex.Message);
  }
  clock.Restart();
  int extraCount = 0;
  var also = new List<long>();
  var missing = new HashSet<ElementId>(requested);
  foreach (ElementId id in deleted)
  {
      CheckBudget();
      if (missing.Remove(id)) continue;
      if (modelInstances.Contains(id))
          throw new InvalidOperationException("REFUSED: Deletion also removes model instance " + id + "; include its id explicitly.");
      if (unclassified.Contains(id))
          throw new InvalidOperationException("Could not verify the category of dependent instance " + id + "; rolling back.");
      extraCount++;
      if (also.Count < 100) also.Add(idOf(id));
  }
  if (missing.Count > 0)
      throw new InvalidOperationException("The deletion result did not contain every requested id.");
  var survivors = selected.Where(id => document.GetElement(id) != null).ToList();
  if (survivors.Count > 0)
      throw new InvalidOperationException("Revit did not delete " + survivors.Count + " selected element(s) ("
          + string.Join(", ", survivors.Take(5).Select(id => idOf(id))) + "); nothing was deleted.");

  return new
  {
      Status = "Deleted",
      ElementIds = selected.Select(id => idOf(id)).ToList(),
      Count = selected.Count,
      AlsoDeleted = also,
      AlsoDeletedCount = extraCount
  };
parameters:
  - name: element_ids
    type: string
    description: "Comma-separated element ids."
    source: designer
    required: true
preconditions:
  - text: "give up to 100 distinct element ids; unpin pinned elements"
not_for:
  - "delete by category"
  - "delete type"
  - "purge"
  - "delete view"
applies_when:
  - "delete elements by id"
  - "delete element ids"
  - "remove the listed element ids"
validator: null
fixtures:
  - name: basic
    params: {element_ids: "101,102"}
    expect: {Status: "Deleted"}
approved_by: null
approved_at: null
created_at: "2026-11-23T00:00:00"
source_query: delete the listed elements
